<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="keyboard">

    <div class="display">

        <div class="top">
            <div class="box">
                <h2 id="correct">0</h2>
                <p>Correct</p>
            </div>

            <div class="box">
                <h2 id="wrong">0</h2>
                <p>Wrong</p>
            </div>
        </div>

        <p id="para"></p>

    </div>

    <div class="row">
        <div class="key">Q</div>
        <div class="key">W</div>
        <div class="key">E</div>
        <div class="key">R</div>
        <div class="key">T</div>
        <div class="key">Y</div>
        <div class="key">U</div>
        <div class="key">I</div>
        <div class="key">O</div>
        <div class="key">P</div>
        <div class="key wide">Backspace</div>
    </div>

    <div class="row">
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
        <div class="key">F</div>
        <div class="key">G</div>
        <div class="key">H</div>
        <div class="key">J</div>
        <div class="key">K</div>
        <div class="key">L</div>
        <div class="key wide">Enter</div>
    </div>

    <div class="row">
        <div class="key wide">Shift</div>
        <div class="key">Z</div>
        <div class="key">X</div>
        <div class="key">C</div>
        <div class="key">V</div>
        <div class="key">B</div>
        <div class="key">N</div>
        <div class="key">M</div>
        <div class="key wide">Shift</div>
    </div>

    <div class="row">
        <div class="key wide">Ctrl</div>
        <div class="key wide">Alt</div>
        <div class="key extra-wide">Space</div>
        <div class="key wide">Alt</div>
        <div class="key wide">Ctrl</div>
    </div>

</div>

<audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script src="script.js"></script>

</body>
</html>
